<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlexVid - brauzerda videoni siqish</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#2ecc71">
<style>
  :root{
    --bg:#0e1116; --card:#171b22; --line:#262c36; --text:#e8ebf0; --muted:#9aa4b2;
    --accent:#2ecc71; --accent2:#58d68d; --err:#ff6b6b; --warn:#f5b041;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --card:#ffffff; --line:#e1e4e9; --text:#171a20; --muted:#5b6573; --err:#c0392b; --warn:#b9770e; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent)}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
  header{border-bottom:1px solid var(--line)}
  .nav{max-width:760px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:60px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;text-decoration:none;color:var(--text)}
  .logo img{width:34px;height:34px;border-radius:8px}
  .logo .wm span{color:var(--accent)}
  .lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .lang button{background:none;border:0;color:var(--muted);padding:5px 10px;cursor:pointer;font:600 13px system-ui}
  .lang button.on{background:var(--accent);color:#06210f}
  h1{font-size:28px;margin:28px 0 6px}
  .sub{color:var(--muted);margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .drop{margin-bottom:14px;border:2px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;cursor:pointer;color:var(--muted)}
  .drop:hover,.drop.over{border-color:var(--accent);color:var(--text)}
  .drop b{color:var(--text)}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  select,input[type=number]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
  .btn{display:inline-block;padding:13px 24px;border-radius:12px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#06210f;font-weight:700;border:0;font-size:16px;cursor:pointer;text-decoration:none}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .bar{height:12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
  .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:6px;gap:10px;flex-wrap:wrap}
  .note{font-size:14px;color:var(--muted)}
  .err{color:var(--err)} .warn{color:var(--warn)} .ok{color:var(--accent)}
  .hide{display:none!important}
  .ad{display:flex;gap:14px;align-items:center}
  .ad img{width:96px;height:96px;object-fit:cover;border-radius:10px;background:var(--bg);flex:none}
  .ad h3{margin:0 0 4px;font-size:17px}
  .ad p{margin:0 0 8px;color:var(--muted);font-size:15px}
  .tag{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:160px;overflow:auto;font-size:12px;white-space:pre-wrap}
  [data-l]{display:none}
  html[lang="uz"] [data-l="uz"],html[lang="ru"] [data-l="ru"],html[lang="en"] [data-l="en"]{display:revert}
  @media (max-width:520px){ .ad{flex-direction:column;align-items:flex-start} }
</style>
</head>
<body>
<header>
  <div class="nav">
    <a class="logo" href="index.html"><img src="logo.png" alt="FlexVid" width="34" height="34"><span class="wm">Flex<span>Vid</span></span></a>
    <div class="lang" role="group" aria-label="Language">
      <button data-set="uz" class="on">UZ</button>
      <button data-set="ru">RU</button>
      <button data-set="en">EN</button>
    </div>
  </div>
</header>

<main class="wrap">
  <h1 id="t_title"></h1>
  <p class="sub" id="t_sub"></p>

  <div class="card" id="engineCard">
    <div id="engineMsg" class="note"></div>
  </div>

  <div class="drop" id="drop" tabindex="0" role="button">
    <input type="file" id="file" accept="video/*,.mkv,.avi,.mov,.mp4,.webm" class="hide">
    <div id="dropText"></div>
  </div>

  <div class="card hide" id="settings">
    <div class="note" id="fileInfo" style="margin-bottom:12px"></div>
    <div class="row">
      <div><label id="l_fmt"></label>
        <select id="fmt"><option value="mp4">MP4 (H.264)</option><option value="mkv">MKV (H.264)</option></select></div>
      <div><label id="l_res"></label>
        <select id="res"><option value="0" id="o_orig"></option><option value="1080">1080p</option><option value="720" selected>720p</option><option value="480">480p</option><option value="360">360p</option></select></div>
      <div><label id="l_size"></label>
        <input type="number" id="size" min="1" step="1" value="50"></div>
    </div>
    <div class="note" id="estimate" style="margin-top:10px"></div>
    <div class="btns">
      <button class="btn" id="start"></button>
      <button class="btn ghost hide" id="cancel"></button>
    </div>
  </div>

  <div class="card hide" id="progressCard">
    <div class="bar"><i id="barFill"></i></div>
    <div class="meta"><span id="pText"></span><span id="pPct"></span></div>
    <div class="note" id="waitLine" style="margin-top:10px"></div>
    <div id="msg" style="margin-top:10px"></div>
    <div class="btns hide" id="doneBtns">
      <a class="btn" id="download" href="#"></a>
      <button class="btn ghost" id="again"></button>
    </div>
  </div>

  <div class="card hide" id="adCard">
    <div class="tag" id="adTag"></div>
    <div class="ad">
      <img id="adImg" alt="" class="hide">
      <div>
        <h3 id="adTitle"></h3>
        <p id="adText"></p>
        <div class="btns" style="margin-top:0">
          <a class="btn" id="adLink" target="_blank" rel="noopener sponsored" href="#"></a>
          <button class="btn ghost" id="adNext"></button>
        </div>
        <div class="note" id="adNote" style="margin-top:8px"></div>
      </div>
    </div>
  </div>

  <details class="card" id="logBox">
    <summary id="logSum"></summary>
    <pre id="log"></pre>
  </details>
</main>

<script>
(function(){
'use strict';

/* ---------- Matnlar (UZ / RU / EN) ---------- */
var T = {
  title:{uz:'Videoni brauzerda siqing',ru:'Сжимайте видео в браузере',en:'Compress video in your browser'},
  sub:{uz:'Video kompyuteringizdan chiqmaydi: hammasi shu sahifada, sizning qurilmangizda bajariladi.',ru:'Видео не покидает ваш компьютер: всё выполняется на этой странице, на вашем устройстве.',en:'Your video never leaves your device: everything runs on this page, locally.'},
  drop:{uz:'<b>Videoni tanlang</b> yoki shu yerga tashlang',ru:'<b>Выберите видео</b> или перетащите сюда',en:'<b>Choose a video</b> or drop it here'},
  fmt:{uz:'Format',ru:'Формат',en:'Format'},
  res:{uz:"Piksel o'lchami",ru:'Разрешение',en:'Resolution'},
  size:{uz:'Natija hajmi (MB)',ru:'Размер результата (МБ)',en:'Target size (MB)'},
  orig:{uz:'Asl o\'lcham',ru:'Как в оригинале',en:'Original'},
  start:{uz:'Siqishni boshlash',ru:'Начать сжатие',en:'Start compressing'},
  cancel:{uz:'Bekor qilish',ru:'Отмена',en:'Cancel'},
  again:{uz:'Yana bitta video',ru:'Ещё одно видео',en:'Another video'},
  download:{uz:'Yuklab olish',ru:'Скачать',en:'Download'},
  loadingEngine:{uz:'Siqish dvigateli yuklanmoqda (bir marta, ~30 MB)...',ru:'Загружается движок сжатия (один раз, ~30 МБ)...',en:'Loading the compression engine (one time, ~30 MB)...'},
  engineReady:{uz:'Dvigatel tayyor.',ru:'Движок готов.',en:'Engine ready.'},
  engineFail:{uz:'Dvigatel yuklanmadi. Internetni tekshiring va sahifani yangilang. Muammo davom etsa, quyidagi "Texnik jurnal" ni yuboring.',ru:'Движок не загрузился. Проверьте интернет и обновите страницу. Если не помогает, отправьте «Технический журнал» ниже.',en:'The engine failed to load. Check your connection and reload. If it persists, send the "Technical log" below.'},
  noVendor:{uz:'ffmpeg.js topilmadi. Sayt egasi: ffmpeg.js va 814.ffmpeg.js fayllarini saytga yuklashi kerak.',ru:'ffmpeg.js не найден. Владельцу сайта нужно загрузить файлы ffmpeg.js и 814.ffmpeg.js.',en:'ffmpeg.js not found. The site owner must upload ffmpeg.js and 814.ffmpeg.js.'},
  fileInfo:{uz:'Fayl',ru:'Файл',en:'File'},
  big:{uz:'Bu fayl juda katta (1.5 GB dan ortiq). Brauzer xotirasi yetmasligi mumkin. Davom etamizmi?',ru:'Файл очень большой (больше 1.5 ГБ). Браузеру может не хватить памяти. Продолжить?',en:'This file is very large (over 1.5 GB). The browser may run out of memory. Continue?'},
  analyzing:{uz:'Video tahlil qilinmoqda...',ru:'Анализ видео...',en:'Analyzing video...'},
  encoding:{uz:'Siqilmoqda... Bu sahifani yopmang.',ru:'Идёт сжатие... Не закрывайте страницу.',en:'Compressing... keep this page open.'},
  est:{uz:'Davomiyligi',ru:'Длительность',en:'Duration'},
  estBitrate:{uz:"Video bitreyti taxminan",ru:'Битрейт видео примерно',en:'Video bitrate about'},
  tooSmall:{uz:"Bu hajm shu video uchun juda kichik. Kattaroq hajm kiriting.",ru:'Слишком маленький размер для этого видео. Укажите больше.',en:'That size is too small for this video. Enter a larger one.'},
  biggerThanSrc:{uz:"Tanlangan hajm asl fayldan katta yoki teng. Siqish kerak emas, kichikroq hajm kiriting.",ru:'Выбранный размер не меньше исходного. Укажите меньше.',en:'The target is not smaller than the source. Enter a smaller size.'},
  done:{uz:'Tayyor!',ru:'Готово!',en:'Done!'},
  resultSize:{uz:'Natija hajmi',ru:'Размер результата',en:'Result size'},
  waitLeft:{uz:'Bepul rejim: natija ochilishiga',ru:'Бесплатный режим: результат откроется через',en:'Free mode: result unlocks in'},
  sec:{uz:'soniya',ru:'сек',en:'sec'},
  waitDone:{uz:'Kutish tugadi.',ru:'Ожидание закончено.',en:'Wait is over.'},
  encDoneWaiting:{uz:'Siqish tugadi. Natija kutish tugagach ochiladi. Reklamani ko\'rsangiz, kutish qisqaradi.',ru:'Сжатие завершено. Результат откроется после ожидания. Просмотр рекламы сокращает его.',en:'Compression finished. The result unlocks when the wait ends. Watching an ad shortens it.'},
  adTag:{uz:'Reklama',ru:'Реклама',en:'Advertisement'},
  adOpen:{uz:'Reklamani ochish',ru:'Открыть рекламу',en:'Open the ad'},
  adNext:{uz:'Keyingisi',ru:'Следующая',en:'Next'},
  adHint:{uz:'Reklama sahifasini oching va shu sahifada {s} soniya qoling: kutish {b} soniyaga qisqaradi.',ru:'Откройте рекламу и оставайтесь на этой странице {s} сек: ожидание сократится на {b} сек.',en:'Open the ad and stay on this page for {s}s: the wait is shortened by {b}s.'},
  adCounting:{uz:'Reklama hisoblanmoqda: {s} soniya...',ru:'Идёт отсчёт рекламы: {s} сек...',en:'Counting ad time: {s}s...'},
  adBonus:{uz:'Rahmat! Kutish {b} soniyaga qisqardi.',ru:'Спасибо! Ожидание сокращено на {b} сек.',en:'Thanks! The wait was shortened by {b}s.'},
  adMax:{uz:'Reklama bonusi limitiga yetdingiz.',ru:'Достигнут лимит бонусов за рекламу.',en:'Ad bonus limit reached.'},
  logSum:{uz:'Texnik jurnal',ru:'Технический журнал',en:'Technical log'},
  fail:{uz:'Siqishda xatolik. Jurnalga qarang.',ru:'Ошибка сжатия. Смотрите журнал.',en:'Compression failed. See the log.'},
  cancelled:{uz:'Bekor qilindi.',ru:'Отменено.',en:'Cancelled.'},
  mountFallback:{uz:'Fayl xotiraga to\'liq yuklanmoqda (katta fayllarda sekin bo\'lishi mumkin)...',ru:'Файл целиком загружается в память (для больших файлов может быть медленно)...',en:'Loading the whole file into memory (may be slow for large files)...'}
};
var lang = 'uz';
function t(k, r){ var s=(T[k]&&(T[k][lang]||T[k].uz))||k; if(r){ for(var x in r) s=s.split('{'+x+'}').join(r[x]); } return s; }

/* ---------- Yordamchilar ---------- */
function $(id){ return document.getElementById(id); }
function fmtBytes(n){ if(n>=1073741824) return (n/1073741824).toFixed(2)+' GB'; return (n/1048576).toFixed(1)+' MB'; }
function fmtTime(s){ s=Math.max(0,Math.round(s)); var m=Math.floor(s/60), r=s%60; return m+':'+(r<10?'0':'')+r; }
var logLines=[]; function log(m){ logLines.push(m); if(logLines.length>400) logLines.shift(); var el=$('log'); el.textContent=logLines.slice(-80).join('\n'); }
function setMsg(html, cls){ var m=$('msg'); m.className=cls||''; m.textContent=html; }

/* ---------- Sozlamalar (ads.json) ---------- */
var CFG = {waitSeconds:90, bonusSeconds:30, watchSeconds:10, maxBonuses:3, ads:[]};
var DEFAULT_AD = {title:'FlexVid', text:'Reklama joyi bo\'sh. Bu yerda sizning reklamangiz bo\'lishi mumkin.', image:'logo.png', link:'index.html'};
function num(v, d, lo, hi){ v=Number(v); if(!isFinite(v)) return d; return Math.min(hi, Math.max(lo, v)); }
function safeUrl(u){ try{ var x=new URL(u, location.href); return (x.protocol==='https:'||x.protocol==='http:')?x.href:null; }catch(e){ return null; } }
function loadConfig(){
  return fetch('ads.json?t='+Date.now(), {cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(j){
    CFG.waitSeconds = num(j.waitSeconds, 90, 0, 600);
    CFG.bonusSeconds = num(j.bonusSeconds, 30, 0, 600);
    CFG.watchSeconds = num(j.watchSeconds, 10, 1, 120);
    CFG.maxBonuses = num(j.maxBonuses, 3, 0, 20);
    CFG.ads = (Array.isArray(j.ads)?j.ads:[]).filter(function(a){ return a && a.title && safeUrl(a.link); });
  }).catch(function(e){ log('ads.json: '+e.message+' (standart sozlama)'); })
  .then(function(){ if(!CFG.ads.length) CFG.ads=[DEFAULT_AD]; });
}

/* ---------- Dvigatel (ffmpeg.wasm) ---------- */
var ffmpeg=null, engineReady=false, engineLoading=null, ffLogs=[];
var CORE_BASES=['https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/','https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/'];
function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=function(){ rej(new Error('script: '+src)); }; document.head.appendChild(s); }); }
function toBlobURL(url, mime){ return fetch(url).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status+' '+url); return r.blob(); }).then(function(b){ return URL.createObjectURL(new Blob([b],{type:mime})); }); }
function loadEngine(){
  if(engineReady) return Promise.resolve();
  if(engineLoading) return engineLoading;
  $('engineMsg').className='note'; $('engineMsg').textContent=t('loadingEngine');
  engineLoading = (function(){
    var VENDOR_PATHS=['ffmpeg.js','vendor/ffmpeg.js','flexvid-web/vendor/ffmpeg.js'];
    function tryVendor(i){ if(i>=VENDOR_PATHS.length) return Promise.reject(new Error('NOVENDOR')); return loadScript(VENDOR_PATHS[i]).then(function(){ if(!window.FFmpegWASM) throw new Error('x'); }).catch(function(){ return tryVendor(i+1); }); }
    var p = window.FFmpegWASM ? Promise.resolve() : tryVendor(0);
    return p.then(function(){
      ffmpeg = new window.FFmpegWASM.FFmpeg();
      ffmpeg.on('log', function(o){ ffLogs.push(o.message); if(ffLogs.length>300) ffLogs.shift(); log(o.message); });
      ffmpeg.on('progress', function(o){ if(onProgress) onProgress(o); });
      var i=0;
      function tryBase(){
        var base=CORE_BASES[i];
        return Promise.all([toBlobURL(base+'ffmpeg-core.js','text/javascript'), toBlobURL(base+'ffmpeg-core.wasm','application/wasm')])
          .then(function(u){ return ffmpeg.load({coreURL:u[0], wasmURL:u[1]}); })
          .catch(function(e){ log('Yuklash xatosi ('+base+'): '+e.message); i++; if(i<CORE_BASES.length) return tryBase(); throw e; });
      }
      return tryBase();
    }).then(function(){ engineReady=true; $('engineMsg').className='note ok'; $('engineMsg').textContent=t('engineReady'); })
    .catch(function(e){
      engineLoading=null; engineReady=false;
      $('engineMsg').className='err';
      $('engineMsg').textContent = (e&&e.message==='NOVENDOR') ? t('noVendor') : t('engineFail');
      $('logBox').open=true; log('ENGINE: '+(e&&e.message)); throw e;
    });
  })();
  return engineLoading;
}
var onProgress=null;

/* ---------- Holat ---------- */
var state={file:null, duration:0, srcH:0, running:false, cancelled:false, blobUrl:null};

function probe(){
  ffLogs=[];
  var path=state.inPath;
  return ffmpeg.exec(['-hide_banner','-i',path]).catch(function(){}).then(function(){
    var txt=ffLogs.join('\n');
    var m=/Duration:\s*(\d+):(\d+):(\d+(?:\.\d+)?)/.exec(txt);
    state.duration = m ? (+m[1])*3600+(+m[2])*60+parseFloat(m[3]) : 0;
    var v=/Stream #[^\n]*Video:[^\n]*?(\d{2,5})x(\d{2,5})/.exec(txt);
    state.srcH = v ? +v[2] : 0;
  });
}

function mountFile(file){
  state.inPath='/in/'+file.name;
  return ffmpeg.createDir('/in').catch(function(){})
    .then(function(){ return ffmpeg.mount('WORKERFS',{files:[file]},'/in'); })
    .then(function(){ state.mounted=true; })
    .catch(function(e){
      log('WORKERFS ishlamadi: '+(e&&e.message)); state.mounted=false;
      setMsg(t('mountFallback'),'note');
      state.inPath='input_file';
      return file.arrayBuffer().then(function(b){ return ffmpeg.writeFile('input_file', new Uint8Array(b)); });
    });
}
function unmountFile(){
  var p = state.mounted ? ffmpeg.unmount('/in').catch(function(){}) : ffmpeg.deleteFile('input_file').catch(function(){});
  state.mounted=false; return p;
}

function videoKbps(sizeMB, dur){
  var total = sizeMB*8388.608*0.97;           // kbit
  return Math.floor(total/dur - 128);         // 128k audio
}
function updateEstimate(){
  var el=$('estimate'); if(!state.duration){ el.textContent=''; return; }
  var mb=+$('size').value, k=videoKbps(mb,state.duration);
  var s=t('est')+': '+fmtTime(state.duration)+'. ';
  if(k<60){ el.className='note err'; el.textContent=s+t('tooSmall'); $('start').disabled=true; return; }
  if(mb*1048576>=state.file.size){ el.className='note warn'; el.textContent=s+t('biggerThanSrc'); $('start').disabled=true; return; }
  el.className='note'; el.textContent=s+t('estBitrate')+' '+k+' kbit/s.'; $('start').disabled=false;
}

/* ---------- Reklama va kutish ---------- */
var adIndex=0, adTimer=null, watchTimer=null, waitTimer=null, bonusesUsed=0, waitLeft=0, encDone=false, resultReady=null, adOpenedAt=0, adAutoTimer=null;
function showAd(){
  var a=CFG.ads[adIndex % CFG.ads.length];
  $('adTitle').textContent=a.title; $('adText').textContent=a.text||'';
  var link=safeUrl(a.link)||'#'; $('adLink').href=link;
  var img=$('adImg'); var iu=a.image?safeUrl(a.image):null;
  if(iu){ img.src=iu; img.classList.remove('hide'); } else img.classList.add('hide');
  $('adNote').className='note'; $('adNote').textContent = bonusesUsed>=CFG.maxBonuses ? t('adMax') : t('adHint',{s:CFG.watchSeconds,b:CFG.bonusSeconds});
}
function stopWatch(){ if(watchTimer){ clearInterval(watchTimer); watchTimer=null; } }
function startWatch(){
  if(bonusesUsed>=CFG.maxBonuses || waitLeft<=0) return;
  stopWatch(); var left=CFG.watchSeconds;
  $('adNote').className='note warn'; $('adNote').textContent=t('adCounting',{s:left});
  watchTimer=setInterval(function(){
    if(document.hidden){ /* sahifada qolmasa, sanoq to'xtaydi */ return; }
    left--; $('adNote').textContent=t('adCounting',{s:Math.max(0,left)});
    if(left<=0){ stopWatch(); bonusesUsed++; waitLeft=Math.max(0, waitLeft-CFG.bonusSeconds); $('adNote').className='note ok'; $('adNote').textContent=t('adBonus',{b:CFG.bonusSeconds}); renderWait(); checkRelease(); }
  },1000);
}
function renderWait(){
  var el=$('waitLine');
  if(waitLeft>0){ el.className='note warn'; el.textContent=t('waitLeft')+' '+waitLeft+' '+t('sec'); }
  else { el.className='note ok'; el.textContent=t('waitDone'); }
}
function beginWait(){
  waitLeft=CFG.waitSeconds; bonusesUsed=0; renderWait();
  if(waitLeft>0){
    $('adCard').classList.remove('hide'); showAd();
    clearInterval(adAutoTimer); adAutoTimer=setInterval(function(){ if(!watchTimer){ adIndex++; showAd(); } },12000);
    clearInterval(waitTimer);
    waitTimer=setInterval(function(){ waitLeft=Math.max(0,waitLeft-1); renderWait(); checkRelease(); if(waitLeft<=0) clearInterval(waitTimer); },1000);
  }
}
function checkRelease(){
  if(encDone && waitLeft<=0 && resultReady){
    var r=resultReady; resultReady=null;
    clearInterval(waitTimer); clearInterval(adAutoTimer); stopWatch(); $('adCard').classList.add('hide');
    finish(r);
  }
}
function finish(r){
  if(state.blobUrl) URL.revokeObjectURL(state.blobUrl);
  state.blobUrl=URL.createObjectURL(r.blob);
  var a=$('download'); a.href=state.blobUrl; a.download=r.name; a.textContent=t('download')+' ('+fmtBytes(r.blob.size)+')';
  $('doneBtns').classList.remove('hide');
  setMsg(t('done')+' '+t('resultSize')+': '+fmtBytes(r.blob.size),'ok');
  $('barFill').style.width='100%'; $('pPct').textContent='100%';
  $('waitLine').textContent='';
}

/* ---------- Siqish ---------- */
function start(){
  if(state.running) return;
  var mb=+$('size').value, fmt=$('fmt').value, res=+$('res').value;
  var k=videoKbps(mb,state.duration);
  if(!state.duration||k<60) return;
  state.running=true; state.cancelled=false; encDone=false; resultReady=null;
  $('settings').querySelectorAll('select,input').forEach(function(e){ e.disabled=true; });
  $('start').classList.add('hide'); $('cancel').classList.remove('hide');
  $('progressCard').classList.remove('hide'); $('doneBtns').classList.add('hide');
  $('barFill').style.width='0'; $('pPct').textContent='0%'; $('pText').textContent=t('encoding'); setMsg('','');
  beginWait();
  var out='out.'+fmt;
  var args=['-hide_banner','-y','-i',state.inPath,'-map','0:v:0','-map','0:a:0?','-c:v','libx264','-preset','veryfast','-b:v',k+'k','-maxrate',Math.floor(k*1.4)+'k','-bufsize',(k*2)+'k','-pix_fmt','yuv420p','-c:a','aac','-b:a','128k','-movflags','+faststart'];
  if(res>0 && (!state.srcH || state.srcH>res)) args.push('-vf',"scale=-2:'min("+res+",ih)'");
  args.push(out);
  var t0=Date.now();
  onProgress=function(o){
    var p=Math.max(0,Math.min(1,o.progress||0)); $('barFill').style.width=(p*100).toFixed(1)+'%'; $('pPct').textContent=Math.floor(p*100)+'%';
    var el=(Date.now()-t0)/1000; if(p>0.03){ $('pText').textContent=t('encoding')+' ~'+fmtTime(el/p-el); }
  };
  ffLogs=[];
  ffmpeg.exec(args).then(function(code){
    if(state.cancelled) return;
    if(code!==0) throw new Error('ffmpeg exit '+code);
    return ffmpeg.readFile(out).then(function(data){
      var blob=new Blob([data.buffer||data],{type: fmt==='mp4'?'video/mp4':'video/x-matroska'});
      var base=state.file.name.replace(/\.[^.]+$/,'');
      ffmpeg.deleteFile(out).catch(function(){});
      encDone=true; resultReady={blob:blob,name:base+'_flexvid.'+fmt};
      if(waitLeft>0){ $('pText').textContent=t('encDoneWaiting'); $('barFill').style.width='100%'; $('pPct').textContent='100%'; }
      checkRelease();
    });
  }).catch(function(e){
    if(state.cancelled) return;
    log('XATO: '+(e&&e.message)); setMsg(t('fail'),'err'); $('logBox').open=true; endRun(true);
  });
}
function endRun(fail){
  state.running=false; onProgress=null; clearInterval(waitTimer); clearInterval(adAutoTimer); stopWatch(); $('adCard').classList.add('hide');
  $('cancel').classList.add('hide'); $('start').classList.remove('hide');
  $('settings').querySelectorAll('select,input').forEach(function(e){ e.disabled=false; });
  if(fail) updateEstimate();
}
function cancel(){
  if(!state.running) return;
  state.cancelled=true; setMsg(t('cancelled'),'note');
  try{ ffmpeg.terminate(); }catch(e){}
  engineReady=false; engineLoading=null; ffmpeg=null; state.mounted=false;
  endRun(false); $('barFill').style.width='0'; $('pPct').textContent=''; $('waitLine').textContent='';
  /* qayta tanlash kerak: dvigatel qayta yuklanadi */
  state.file=null; $('settings').classList.add('hide'); $('dropText').innerHTML=t('drop');
  loadEngine().catch(function(){});
}
function reset(){
  if(state.blobUrl){ URL.revokeObjectURL(state.blobUrl); state.blobUrl=null; }
  endRun(false); unmountFile();
  state.file=null; $('progressCard').classList.add('hide'); $('settings').classList.add('hide'); $('dropText').innerHTML=t('drop'); $('file').value='';
}

/* ---------- Fayl tanlash ---------- */
function pick(file){
  if(!file || state.running) return;
  if(file.size>1.5*1073741824 && !confirm(t('big'))) return;
  state.file=file; state.duration=0;
  $('progressCard').classList.add('hide'); $('doneBtns').classList.add('hide');
  $('dropText').innerHTML=t('analyzing');
  loadEngine().then(function(){ return unmountFile().then(function(){ return mountFile(file); }); })
  .then(probe).then(function(){
    if(!state.duration){ $('dropText').innerHTML=t('drop'); setMsg('','');$('progressCard').classList.remove('hide'); setMsg(t('fail'),'err'); $('logBox').open=true; return; }
    $('dropText').innerHTML=t('drop');
    $('fileInfo').textContent=t('fileInfo')+': '+file.name+' · '+fmtBytes(file.size)+' · '+fmtTime(state.duration);
    var def=Math.max(1,Math.round(file.size/1048576*0.3)); $('size').value=def; $('size').max=Math.floor(file.size/1048576);
    $('settings').classList.remove('hide'); updateEstimate();
  }).catch(function(e){ $('dropText').innerHTML=t('drop'); log('XATO: '+(e&&e.message)); });
}

/* ---------- Til va hodisalar ---------- */
function applyLang(l){
  if(['uz','ru','en'].indexOf(l)<0) l='uz'; lang=l; document.documentElement.lang=l;
  document.querySelectorAll('.lang button').forEach(function(b){ b.classList.toggle('on', b.dataset.set===l); });
  try{ localStorage.setItem('fv_lang', l); }catch(e){}
  $('t_title').textContent=t('title'); $('t_sub').textContent=t('sub'); $('dropText').innerHTML=state.file&&!state.running?t('drop'):t('drop');
  $('l_fmt').textContent=t('fmt'); $('l_res').textContent=t('res'); $('l_size').textContent=t('size'); $('o_orig').textContent=t('orig');
  $('start').textContent=t('start'); $('cancel').textContent=t('cancel'); $('again').textContent=t('again');
  $('adTag').textContent=t('adTag'); $('adLink').textContent=t('adOpen'); $('adNext').textContent=t('adNext'); $('logSum').textContent=t('logSum');
  if(engineReady) $('engineMsg').textContent=t('engineReady');
}
document.querySelectorAll('.lang button').forEach(function(b){ b.addEventListener('click', function(){ applyLang(b.dataset.set); }); });
var drop=$('drop'), fileIn=$('file');
drop.addEventListener('click', function(){ if(!state.running) fileIn.click(); });
drop.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(!state.running) fileIn.click(); } });
['dragenter','dragover'].forEach(function(n){ drop.addEventListener(n, function(e){ e.preventDefault(); drop.classList.add('over'); }); });
['dragleave','drop'].forEach(function(n){ drop.addEventListener(n, function(e){ e.preventDefault(); drop.classList.remove('over'); }); });
drop.addEventListener('drop', function(e){ if(e.dataTransfer.files&&e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]); });
fileIn.addEventListener('change', function(){ if(fileIn.files[0]) pick(fileIn.files[0]); });
$('size').addEventListener('input', updateEstimate);
$('start').addEventListener('click', start);
$('cancel').addEventListener('click', cancel);
$('again').addEventListener('click', reset);
$('adNext').addEventListener('click', function(){ if(!watchTimer){ adIndex++; showAd(); } });
$('adLink').addEventListener('click', function(){ startWatch(); });

var saved=null; try{ saved=localStorage.getItem('fv_lang'); }catch(e){}
if(!saved){ var n=(navigator.language||'uz').slice(0,2).toLowerCase(); saved=n==='ru'?'ru':n==='en'?'en':'uz'; }
applyLang(saved);
loadConfig().then(function(){ return loadEngine(); }).catch(function(){});
window.__fv={state:state, CFG:CFG};
})();
</script>
